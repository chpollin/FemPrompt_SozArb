# Assessment Categories
# Version: 1.4.1 (analysis fields amended for the five sub-questions SQ1 to SQ5, rule clarifications of the 1.4 pilot; eligibility content unchanged from v1.2)
# Synchronized with Human-Assessment Google Sheets schema
# The analysis_presentation block at the end holds German display labels and short
# definitions. It is presentation only and changes no coding value, key or rule.

metadata:
  project: Literature Review (AI Literacy & Bias in Social Work)
  last_updated: 2026-10-01
  status: active
  # The category "type: binary" below describes the completed benchmark tracks (human and
  # LLM 10K). The PRISM screening tool scores the same categories three-level and derives a
  # three-way decision (ADR-024, knowledge/specification.md); the benchmark annotations are
  # read as-is.
  screening_scale:
    levels: [nein, teilweise, ja]   # 0 / 1 / 2
    derivation: "both dimensions ja => Include; both at least teilweise => Unclear; any dimension entirely nein => Exclude"
  changelog:
    - "v1.4.1 (2026-10-01, accepted by the operator on 2026-10-01, confirmed 2026-10-02): three rule clarifications from the 1.4 pilot run, where AN_Harm_Types had the lowest track agreement. A harm type needs the work's own argument or result, not a harm cited from other work. A difference in tone or style of model output is not by itself Disparate_Performance. Social_Construct in AN_Gender_Understanding needs an explicit statement in the work. No value, field or eligibility rule changed."
    - "v1.4 (2026-10-01): operator adoption of the amended codebook (knowledge/codebook-v1.4-proposal.md, status adopted). New SQ4 fields AN_Gender_Definition, AN_Bias_Definition, AN_Gender_Understanding and AN_Theory_Reference, new pilot field AN_Task for SQ1, coding rules and anchors for AN_Bias_Axes and AN_Harm_Types, derived field state not_collected for annotations coded under an earlier codebook version. Analysis fields are coded by AI agent tracks only. AN_Stage_Status is deferred until a validator exists. Ten eligibility categories, decision rule and exclusion reasons unchanged."
    - "2026-10-01: exclusion reason Consolidated_expert_exclusion added so PRISM can confirm a consolidated expert Exclude without inventing a reason (ADR-042); German display labels for the exclusion reasons; categories, decision rule and analysis vocabulary unchanged."
    - "v1.3 (2026-07-17): analysis_fields block frozen after the pilot and operator study-goal clarification (update-protocol B.1); Studientyp becomes required for Include; eligibility content unchanged from v1.2."
    - "2026-07-01: three-level PRISM screening scale documented (ADR-024); benchmark type stays binary."
    - "v1.2: Beispiele fuer Bias_Ungleichheit, Gender, Diversitaet, Fairness ergaenzt. Doku synchronisiert."
    - "v1.1: KI_Sonstige zur Inklusions-Logik hinzugefügt (algorithmische Systeme in Sozialer Arbeit)"

categories:
  # Technik-Dimensionen
  - name: AI_Literacies
    definition: >
      Das Paper behandelt Kompetenzen, Fähigkeiten oder Wissen im Umgang
      mit KI-Systemen. Umfasst kritische Reflexion, technisches Verständnis
      oder praktische Anwendungskompetenz.
    type: binary
    group: technik
    examples_positive:
      - "Framework für KI-Kompetenzentwicklung"
      - "Curriculum für AI Literacy in Schulen"
    examples_negative:
      - "Rein technische KI-Implementierung ohne Bildungsbezug"

  - name: Generative_KI
    definition: >
      Fokus auf generative KI-Modelle wie Large Language Models,
      Bildgeneratoren oder andere generative Systeme.
    type: binary
    group: technik
    examples_positive:
      - "ChatGPT in der Beratung"
      - "Midjourney für kreative Prozesse"
    examples_negative:
      - "Klassische ML-Klassifikation ohne generativen Aspekt"

  - name: Prompting
    definition: >
      Behandelt Prompt-Engineering, Prompt-Strategien oder die Gestaltung
      von Eingaben für KI-Systeme.
    type: binary
    group: technik
    examples_positive:
      - "Chain-of-Thought Prompting für Bias-Reduktion"
      - "Prompt-Templates für Dokumentation"
    examples_negative:
      - "KI-Nutzung ohne Fokus auf Eingabegestaltung"

  - name: KI_Sonstige
    definition: >
      Andere KI/ML-Themen: klassisches Machine Learning, algorithmische
      Entscheidungssysteme, Predictive Analytics, Robotik, Computer Vision.
      WICHTIG: Algorithmische Systeme im Sozialbereich (z.B. Risikobewertung
      in der Jugendhilfe) zählen hierzu und sind relevant!
    type: binary
    group: technik
    examples_positive:
      - "Algorithmische Risikobewertung in der Jugendhilfe"
      - "Predictive Policing und soziale Auswirkungen"
      - "Machine Learning für Fallprognosen"
    examples_negative:
      - "Reine Robotik ohne sozialen Bezug"

  # Sozial-Dimensionen
  - name: Soziale_Arbeit
    definition: >
      Direkter Bezug zu sozialarbeiterischer Praxis, Theorie, Ausbildung
      oder den Zielgruppen Sozialer Arbeit.
    type: binary
    group: sozial
    examples_positive:
      - "KI in der Jugendhilfe"
      - "Algorithmische Entscheidungssysteme im Sozialamt"
    examples_negative:
      - "Allgemeine KI-Ethik ohne Sozialarbeitsbezug"

  - name: Bias_Ungleichheit
    definition: >
      Thematisiert Diskriminierung, algorithmischen Bias, soziale Ungleichheit
      oder strukturelle Benachteiligung im KI-Kontext.
    type: binary
    group: sozial
    examples_positive:
      - "Analyse von Racial Bias in LLM-Outputs"
      - "Algorithmische Diskriminierung bei Kreditvergabe"
    examples_negative:
      - "Allgemeine KI-Performance-Studie ohne Bias-Fokus"

  - name: Gender
    definition: >
      Expliziter Gender-Fokus, Geschlechterperspektive oder
      Analyse von Gender-Bias.
    type: binary
    group: sozial
    examples_positive:
      - "Gender-Bias in Sprachmodellen"
      - "Geschlechterstereotype in KI-generierten Bildern"
    examples_negative:
      - "Demografische Daten enthalten Geschlecht, aber kein Gender-Fokus"

  - name: Diversitaet
    definition: >
      Thematisiert Diversität, Inklusion oder Repräsentation
      verschiedener Gruppen.
    type: binary
    group: sozial
    examples_positive:
      - "Inklusive KI-Entwicklung mit marginalisierten Communities"
      - "Repraesentation verschiedener Ethnien in Trainingsdaten"
    examples_negative:
      - "Diverse Methoden verwendet (methodische Diversitaet, nicht sozial)"

  - name: Feministisch
    definition: >
      Verwendet feministische Theorie, Methodik oder Perspektive.
      Auch implizit feministische Ansätze zählen: intersektionale Analysen,
      kritische Betrachtung von Machtstrukturen, Fokus auf marginalisierte
      Gruppen aus Geschlechterperspektive.
    type: binary
    group: sozial
    examples_positive:
      - "Intersektionale Analyse nach Crenshaw"
      - "Kritik aus feministischer Technikforschung"
      - "Analyse von Gender-Bias mit Fokus auf strukturelle Ungleichheit"
      - "Bezug auf feminist HCI, feminist STS"
    examples_negative:
      - "Gender nur als Variable erwähnt ohne kritische Perspektive"

  - name: Fairness
    definition: >
      Thematisiert algorithmische Fairness, faire ML-Systeme
      oder Fairness-Metriken.
    type: binary
    group: sozial
    examples_positive:
      - "Fairness-Metriken fuer Klassifikationsmodelle"
      - "Fair ML Frameworks und Debiasing-Strategien"
    examples_negative:
      - "Allgemeine Ethik-Diskussion ohne spezifischen Fairness-Bezug"

decision:
  field: Decision
  options:
    - Include
    - Exclude
    - Unclear
  include_criteria: >
    Paper wird eingeschlossen wenn BEIDE Bedingungen erfüllt sind:

    1. TECHNIK: Mindestens eine dieser Kategorien ist Ja:
       - AI_Literacies (KI-Kompetenzen)
       - Generative_KI (LLMs, ChatGPT, etc.)
       - Prompting (Prompt-Engineering)
       - KI_Sonstige (klassisches ML, algorithmische Systeme)

    2. SOZIAL: Mindestens eine dieser Kategorien ist Ja:
       - Soziale_Arbeit
       - Bias_Ungleichheit
       - Gender
       - Diversitaet
       - Feministisch
       - Fairness

    WICHTIG: Die Decision MUSS konsistent mit den Kategorie-Bewertungen sein!
    Wenn Technik UND Sozial erfüllt → Include.
    Wenn nur Technik ODER nur Sozial → Exclude.

exclusion_reasons:
  - code: Duplicate
    label: Duplikat
    description: Identische Publikation aus anderem Source_Tool
  - code: Not_relevant_topic
    label: Thema nicht einschlägig
    description: Thematisch nicht passend
  - code: Wrong_publication_type
    label: Falscher Publikationstyp
    description: Ungeeigneter Publikationstyp (Blogbeitrag, etc.)
  - code: No_full_text
    label: Kein Volltext
    description: Kein Volltext verfügbar
  - code: Language
    label: Sprache
    description: Sprache nicht zugänglich
  - code: Consolidated_expert_exclusion
    label: Expert:innen-Entscheidung übernommen
    description: Die konsolidierte Expert:innen-Entscheidung Exclude wird in PRISM bestätigt (ADR-042)

study_types:
  - Empirisch
  - Experimentell
  - Theoretisch
  - Konzept
  - Literaturreview
  - Unclear

# Analysis fields (TP4), frozen 2026-07-17, amended to v1.4 and clarified as v1.4.1 on 2026-10-01
# (knowledge/codebook-v1.4-proposal.md). Descriptive coding fields for included papers,
# NOT eligibility criteria; eligibility content above is unchanged (v1.2). Rules in
# knowledge/update-protocol.md (Analysis coding). Coded only for Decision = Include and
# only by AI agent tracks, human reviewers screen. `serves` names the sub-questions SQ1
# to SQ5 of knowledge/project.md (numbering of 2026-10-01). `introduced_in` marks a field
# added after v1.3, and an annotation coded under an earlier version derives the state
# not_collected for it (analysis_field_states). `rules` and `anchors` are coding guidance
# for the agent tracks and are not projected into the app vocabulary.
analysis_fields:
  - name: AN_Prompting_Role
    multi: true
    serves: [SQ1, SQ3, SQ5]  # SQ1 through Recommended_Practice, SQ5 through Learning_Content. Covers all prompting evidence, not only techniques.
    values: [Recommended_Practice, Research_Instrument, Object_of_Critique, Learning_Content, None]
  - name: AN_Prompt_Techniques
    multi: true
    serves: SQ3
    values: [ICL, Thought_Generation, Decomposition, Ensembling, Self_Criticism, Role_Persona, General_Guidance, None]
    note: "None is legitimate with Prompting=Ja; the concrete strategy behind General_Guidance goes verbatim to AN_Notes."
  - name: AN_Bias_Axes
    multi: true
    serves: SQ2
    values: [Gender, Race_Ethnicity, Intersectional, Disability, Age, Socioeconomic, Language_Culture, Sexual_Orientation_Identity, Religion, Physical_Appearance, Nationality_Migration, Other_Axis, None]
    note: "Intersectional requires at least two axes treated in their interaction, not merely co-mentioned."
    rules:
      - "An axis is coded when the work analyses bias along it, measures or compares groups along it, or uses it as a worked example in its own argument. An axis that appears only in an enumeration of protected attributes, in sample demographics, in a related-work passage or in an outlook is left uncoded."
      - "Other_Axis is reserved for a social axis of disadvantage that the list lacks, such as caste or place of residence, and the axis is named in AN_Notes. Unspecified marginalised groups and non-social variables such as study subject or programming experience are no axes. Other_Axis never replaces a listed axis."
      - "None applies when the work discusses bias without any axis it analyses in the sense of the first rule."
      - "Race_Ethnicity covers racialisation and ethnic group, Nationality_Migration citizenship, country of origin and migration or refugee status, Language_Culture language, language variety and cultural region. The axis is coded under the name the work gives it, and both are coded when the work uses both."
      - "Intersectional additionally requires a passage in which the outcome or argument depends on the combination of axes, such as a result for Black women that differs from the results for Black people and for women."
    anchors:
      - "HMDFMBV3 (positive for Intersectional): the dataset pairs a combined group with its stereotype, such as ('Black+Women', 'Angry Black Woman'), section 2.3."
      - "R7V99ERA (negative for enumerations): the introduction lists gender, disability and mental health status as dimensions studied elsewhere, while the work itself examines race, so only Race_Ethnicity is coded."
      - "VSZM7CT6 (boundary): the sentence 'AI algorithms may reinforce racial and gender stereotypes' counts only when the work develops it as its own worked example."
  - name: AN_Harm_Types
    multi: true
    optional: true
    binding_when: AN_Coding_Basis = Fulltext
    serves: SQ2
    values: [Derogatory_Language, Disparate_Performance, Erasure, Exclusionary_Norms, Misrepresentation, Stereotyping, Toxicity, Direct_Discrimination, Indirect_Discrimination, None]
    rules:
      - "A harm type is coded when the work demonstrates, measures or argues the mechanism for its own object, and every assigned value has its own passage. A harm named only in background, in a definitions table or in a related-work passage is left uncoded, and so is a harm the work only cites from other work, including a list of cited cases, when its own argument or result does not establish it. A review or taxonomy codes the harm types that structure its own synthesis as a section, table row or coded category."
      - "Allocational harms are separated from representational harms first (Gallegos et al. 2024, Table 1). Direct_Discrimination and Indirect_Discrimination require an allocation or a decision about persons or groups, such as hiring, benefits, screening-in or a risk score. Output that depicts or describes a group is a representational harm."
      - "Direct_Discrimination applies when the decision changes with the group attribute itself, stated in the input or the rule. Indirect_Discrimination applies when an apparently neutral criterion or proxy such as a name, postcode, prior service contact or digital access produces the disadvantage. An audit that varies names correlated with race or gender is indirect discrimination. When the work classifies the discrimination itself, its classification is coded."
      - "Disparate_Performance covers differences in system quality between groups or language varieties, such as accuracy, error rate or recognition. A difference in decision outcomes is discrimination, a difference in quality is Disparate_Performance, and a work that shows both codes both. A difference in tone or style of model output between groups is not by itself Disparate_Performance."
      - "Exclusionary_Norms applies when the norm of a dominant group acts as default and other groups are left out or devalued, such as a male default, cis-centric answers or the assumption of digitally skilled clients. Stereotyping ascribes attributes to a group, Erasure leaves a group or its experience out, Misrepresentation generalises an unrepresentative depiction to a group."
    anchors:
      - "MS3CNU3S (taxonomy): Table 1 divides representational harms from allocational harms, the latter being the 'Disparate distribution of resources or opportunities between social groups'."
      - "YMABYPKF (Indirect_Discrimination): an audit of names correlated with race and gender concludes that disparities 'may constitute bias in the form of disparate impact'."
      - "7FEFMCBZ (allocational harm): a racial disparity in screen-in decisions of child welfare workers and an algorithm is discrimination, not only Disparate_Performance."
      - "MA3LBJS6 (Exclusionary_Norms): digital first contact must not be the only route, since otherwise less digitally skilled help seekers are no longer reached."
  - name: AN_Mitigation_Stage
    multi: true
    serves: [SQ3, SQ5]  # SQ5 through Organisational_Process
    values: [Pre_Processing, In_Training, Intra_Processing, Post_Processing, Prompt_Practice, Organisational_Process, None]
  - name: AN_Mitigation_Status
    multi: false
    serves: SQ3
    values: [Evaluated, Demonstrated, Proposed, None]
  - name: AN_Population
    multi: true
    serves: [SQ1, SQ2]
    values: [Child_Family_Welfare, Mental_Health, Health_Care, Homelessness_Youth, Social_Assistance_Admin, Education_Professional, General_Social_Work, Not_SW_Specific]
    note: "Education_Professional restricted to professional or higher-education AI-literacy settings; general or unspecified context goes to Not_SW_Specific."
  - name: AN_Task
    multi: true
    optional: true  # binding for Include once the pilot has finalised the values
    introduced_in: "1.4"
    pilot: true  # values are candidates until the pilot decision rule is met
    serves: SQ1
    values: [Documentation_Recording, Case_Assessment_Decision_Support, Counselling_Client_Communication, Administration, Research, Teaching_Further_Education, Other_Task, None]
    note: "Task of professional practice for which the work describes, tests or proposes the use of AI. Complements AN_Population, which records the field or group of addressees. Documentation_Recording and Administration are separated by the case reference. A general LLM benchmark without an application task receives None. A task outside social work, such as resume screening, receives Other_Task with the task named in AN_Notes."
  - name: AN_Gender_Definition
    multi: false
    optional: true  # binding when the coding basis is the full text
    introduced_in: "1.4"
    binding_when: AN_Coding_Basis = Fulltext
    serves: SQ4
    values: [Explicit, Implicit_Only, Absent, Not_Applicable]
    note: "Whether the work says what it means by gender. Not_Applicable exactly when AN_Gender_Understanding is Not_Applicable, Absent exactly when it is Unclear. Sample demographics, a gender control variable or a single mention in an enumeration do not make gender an object. An Explicit code carries its defining passage with location."
    anchors:
      - "GP4JDSI8 (Explicit): 'neither sex nor gender are essential, natural, or fixed properties'."
      - "CYZQ6XPK (Implicit_Only): 'The gender biases we considered in this paper cover only binary gender.' in the limitations."
      - "RAV6DAFQ (Not_Applicable): no passage treats gender as an object."
  - name: AN_Bias_Definition
    multi: false
    optional: true
    introduced_in: "1.4"
    binding_when: AN_Coding_Basis = Fulltext
    serves: SQ4
    values: [Explicit, Implicit_Only, Absent, Not_Applicable]
    note: "Whether the work says what it means by bias. Explicit when the work determines bias, discrimination or unfairness in a sentence of its own or adopts a cited or technical determination explicitly, such as a fairness criterion or the legal pair of disparate treatment and disparate impact. Implicit_Only when the understanding is recognisable from measurement or frame only. Absent when the work treats bias without either. Not_Applicable when bias is no object of the work. An Explicit code carries its defining passage with location."
    anchors:
      - "AZJW38MF (Explicit): 'In social work it is common to define bias as a prejudice against certain problems'."
      - "YMABYPKF (Explicit): bias is introduced through the legal pair of disparate treatment and disparate impact."
  - name: AN_Gender_Understanding
    multi: true
    optional: true
    introduced_in: "1.4"
    binding_when: AN_Coding_Basis = Fulltext
    serves: SQ4
    values: [Binary_Categorical, Social_Construct, Non_Binary_Inclusive, Intersectional, Unclear, Not_Applicable]
    note: "The understanding of gender that underlies the work's own analysis. A conceptual statement that the analysis does not follow goes to AN_Notes and the value follows the analysis. Binary_Categorical and Non_Binary_Inclusive exclude each other. Unclear and Not_Applicable stand alone. Social_Construct and Intersectional combine with each other and with Non_Binary_Inclusive. Intersectional follows the rule of Intersectional in AN_Bias_Axes. Non_Binary_Inclusive needs genders beyond the binary as categories of the analysis, a limitation sentence does not suffice. Social_Construct needs an explicit statement in the work that gender is socially produced, a relation or a power structure."
    anchors:
      - "2EBHMYU4 (Social_Construct and Intersectional): 'the traditional understanding of gender as binary (male/female) is being challenged today' with intersectionality as frame."
      - "3XMBE43Z (Non_Binary_Inclusive): 'we included variations that referenced non-binary individuals'."
      - "22XEFRWP (boundary): 'Gender was dummy-coded (0 = woman, 1 = man)' is sample demography and decides nothing alone."
  - name: AN_Theory_Reference
    multi: false
    optional: true
    introduced_in: "1.4"
    binding_when: AN_Coding_Basis = Fulltext
    serves: SQ4
    values: ["Yes", "No"]  # quoted, YAML 1.1 would read bare Yes and No as booleans
    note: "Yes when the work names a theory, theoretical tradition or theoretical concept and uses it to frame its treatment of gender or bias. A citation that supports an empirical finding is no theory reference, and a theory that frames neither gender nor bias does not count. Each theory is recorded as a source-linked theory reference with its passage and location, not as a closed code."
    anchors:
      - "7L93JBLR (Yes): queer theory and intersectional feminism frame the treatment of gender equality in EU AI law."
      - "CYZQ6XPK (No): an evaluation of gender bias without a theoretical frame."
  - name: AN_Coding_Basis
    multi: false
    serves: audit-trail
    values: [Fulltext, Knowledge_Doc, Abstract]
  - name: AN_Notes
    free_text: true

# Field states for analysis fields. Derived per annotation and field, never entered as a
# code. not_collected keeps a field introduced after the codebook version of an annotation
# apart from coded absence (None), from undecidable and from a field still to be coded.
analysis_field_states:
  not_collected:
    label: Nicht erhoben
    definition: Das Feld wurde erst nach der Codebuchversion eingeführt, unter der der Datensatz codiert wurde. Der Zustand sagt nichts über das Werk aus.
    applies_when: introduced_in of the field is later than the codebook version recorded for the annotation, and an annotation without a recorded version counts as v1.3

# Presentation metadata for PRISM and the public Evidence Companion, projected by
# src/publish/build_analysis_fields.py into docs/data/analysis_fields.json. German
# display labels and one-line definitions for every analysis field, every value and
# the study types. Presentation only. The coding vocabulary and its rules remain
# study_types, analysis_fields and knowledge/update-protocol.md (Analysis coding).
# The projection fails when a field or value lacks an entry here or when an entry
# names a field or value outside the vocabulary.
analysis_presentation:
  AN_Prompting_Role:
    label: Rolle des Promptings
    definition: In welcher Rolle Prompting im Werk vorkommt, unabhängig davon, ob eine Technik codierbar ist.
    values:
      Recommended_Practice:
        label: Empfohlene Praxis
        definition: Das Werk empfiehlt oder vermittelt Prompting als Vorgehen.
      Research_Instrument:
        label: Forschungsinstrument
        definition: Prompts dienen dazu, Modellverhalten hervorzurufen oder zu messen, etwa als Bias-Test.
      Object_of_Critique:
        label: Gegenstand der Kritik
        definition: Prompting selbst wird als Praxis analysiert oder kritisiert.
      Learning_Content:
        label: Lerninhalt
        definition: Prompting ist vermittelter Inhalt von KI-Kompetenz (AI Literacy).
      None:
        label: Nicht behandelt
        definition: Das Werk behandelt Prompting nicht.
  AN_Prompt_Techniques:
    label: Prompting-Techniken
    definition: Im Werk benannte oder erkennbar beschriebene Prompting-Techniken, gruppiert nach den Technikfamilien des Prompt Report (Schulhoff et al. 2025).
    values:
      ICL:
        label: In-Context-Learning
        definition: Beispiele oder Demonstrationen im Prompt leiten die Antwort an.
      Thought_Generation:
        label: Erzeugung von Denkschritten
        definition: Das Modell wird angeleitet, Zwischenschritte seines Lösungswegs auszuformulieren, etwa durch Chain-of-Thought.
      Decomposition:
        label: Zerlegung
        definition: Eine Aufgabe wird in Teilaufgaben zerlegt, die einzeln bearbeitet werden.
      Ensembling:
        label: Ensembling
        definition: Mehrere Prompts oder Antworten werden erzeugt und zu einem Ergebnis zusammengeführt.
      Self_Criticism:
        label: Selbstkritik
        definition: Das Modell prüft die eigene Ausgabe und überarbeitet sie.
      Role_Persona:
        label: Rolle und Persona
        definition: Der Prompt weist dem Modell eine Rolle oder Persona zu.
      General_Guidance:
        label: Allgemeine Anleitung
        definition: Allgemeine Hinweise zum Prompting ohne benannte Technikfamilie, die konkrete Strategie steht in den Notizen.
      None:
        label: Keine Technik
        definition: Das Werk nennt keine codierbare Technik, auch wenn es Prompting behandelt.
  AN_Bias_Axes:
    label: Bias-Achsen
    definition: Soziale Achsen, entlang derer das Werk Bias analysiert, misst, Gruppen vergleicht oder ein eigenes Beispiel ausführt. Eine Achse, die nur in einer Aufzählung geschützter Merkmale, in Stichprobenangaben, im Forschungsstand oder im Ausblick steht, wird nicht codiert.
    values:
      Gender:
        label: Geschlecht
        definition: Das Werk analysiert Bias entlang des Geschlechts.
      Race_Ethnicity:
        label: Rassifizierung und Ethnizität
        definition: Das Werk analysiert Bias entlang rassistischer Zuschreibung oder ethnischer Zugehörigkeit.
      Intersectional:
        label: Intersektional
        definition: Das Werk behandelt mindestens zwei Achsen in ihrer Wechselwirkung, und eine Textstelle zeigt ein Ergebnis oder Argument, das von der Kombination abhängt.
      Disability:
        label: Behinderung
        definition: Das Werk analysiert Bias entlang von Behinderung.
      Age:
        label: Alter
        definition: Das Werk analysiert Bias entlang des Alters.
      Socioeconomic:
        label: Sozioökonomischer Status
        definition: Das Werk analysiert Bias entlang von Einkommen, Bildung oder sozialer Lage.
      Language_Culture:
        label: Sprache und Kultur
        definition: Das Werk analysiert Bias entlang von Sprache, Sprachvarietät oder kultureller Zugehörigkeit.
      Sexual_Orientation_Identity:
        label: Sexuelle und geschlechtliche Identität
        definition: Das Werk analysiert Bias entlang sexueller Orientierung oder Geschlechtsidentität.
      Religion:
        label: Religion
        definition: Das Werk analysiert Bias entlang religiöser Zugehörigkeit.
      Physical_Appearance:
        label: Äußeres Erscheinungsbild
        definition: Das Werk analysiert Bias entlang des äußeren Erscheinungsbilds.
      Nationality_Migration:
        label: Nationalität und Migration
        definition: Das Werk analysiert Bias entlang von Staatsangehörigkeit, Herkunft oder Migration.
      Other_Axis:
        label: Andere Achse
        definition: Das Werk analysiert Bias entlang einer sozialen Achse, die diese Liste nicht enthält, etwa Kaste oder Wohnort. Die Achse steht in den Notizen.
      None:
        label: Keine Achse
        definition: Das Werk behandelt Bias, analysiert ihn aber entlang keiner bestimmten sozialen Achse.
  AN_Harm_Types:
    label: Schadensarten
    definition: Schadensmechanismen nach der Taxonomie von Gallegos et al. (2024), die das Werk für seinen eigenen Gegenstand nachweist, misst oder argumentiert, jeder Wert mit eigener Textstelle. Verbindlich bei Volltext als Codierbasis.
    values:
      Derogatory_Language:
        label: Abwertende Sprache
        definition: Beleidigungen, Schimpfwörter oder andere Ausdrücke, die eine soziale Gruppe herabsetzen.
      Disparate_Performance:
        label: Ungleiche Leistung
        definition: Die Qualität des Systems, etwa Genauigkeit, Fehlerrate oder Erkennung, unterscheidet sich zwischen sozialen Gruppen oder Sprachvarietäten. Ein Unterschied in Ton oder Stil der Ausgabe ist für sich keine ungleiche Leistung.
      Erasure:
        label: Unsichtbarmachung
        definition: Sprache und Erfahrungen einer sozialen Gruppe werden ausgelassen oder unsichtbar gemacht.
      Exclusionary_Norms:
        label: Ausschließende Normen
        definition: Die Norm einer dominanten Gruppe wirkt als Standard, andere Gruppen werden ausgelassen oder abgewertet, etwa männlicher Standard oder die Annahme digital versierter Klient:innen.
      Misrepresentation:
        label: Fehldarstellung
        definition: Eine unvollständige oder nicht repräsentative Darstellung wird auf eine soziale Gruppe verallgemeinert.
      Stereotyping:
        label: Stereotypisierung
        definition: Negative, als unveränderlich dargestellte Zuschreibungen an eine soziale Gruppe.
      Toxicity:
        label: Toxizität
        definition: Anstößige Sprache, die eine soziale Gruppe angreift, bedroht oder zu Hass oder Gewalt aufruft.
      Direct_Discrimination:
        label: Unmittelbare Diskriminierung
        definition: Eine Entscheidung über Personen oder Gruppen, etwa Einstellung, Leistung oder Risikowert, ändert sich mit dem Gruppenmerkmal selbst.
      Indirect_Discrimination:
        label: Mittelbare Diskriminierung
        definition: Eine Entscheidung über Personen oder Gruppen benachteiligt über ein scheinbar neutrales Kriterium oder stellvertretendes Merkmal, etwa Name, Postleitzahl oder digitalen Zugang.
      None:
        label: Keine Schadensart
        definition: Das Werk benennt keinen Schadensmechanismus.
  AN_Mitigation_Stage:
    label: Stufe der Schutzmaßnahme
    definition: Stufe, auf der eine Maßnahme gegen Bias tatsächlich ansetzt, jede vergebene Stufe braucht eigene Belege im Werk.
    values:
      Pre_Processing:
        label: Datenvorbereitung
        definition: Auswahl, Bereinigung, Anreicherung, Gewichtung oder andere Vorbereitung der Lerndaten.
      In_Training:
        label: Training
        definition: Ein Eingriff, der ausdrücklich im Lernen oder Nachtrainieren des Modells ansetzt.
      Intra_Processing:
        label: Inferenz
        definition: Ein bestimmter technischer Eingriff während der Modellanwendung.
      Post_Processing:
        label: Nachbearbeitung der Ausgabe
        definition: Eine technische Änderung der Modellausgaben oder gelernten Repräsentationen, etwa Kalibrierung oder Filterung.
      Prompt_Practice:
        label: Prompting-Praxis
        definition: Eine Änderung der Anweisungen oder des Vorgehens beim Prompting.
      Organisational_Process:
        label: Organisation
        definition: Verantwortung, Beteiligung, Schulung, Governance, Audit oder menschliche Aufsicht.
      None:
        label: Keine Maßnahme
        definition: Das Werk behandelt keine Maßnahme gegen Bias.
  AN_Mitigation_Status:
    label: Evidenzstand
    definition: Höchste Stufe, bis zu der das Werk eine Maßnahme führt, ein Wert für das ganze Werk.
    values:
      Evaluated:
        label: Evaluiert
        definition: Eine bestimmte Maßnahme wurde abschließend geprüft und ein Ergebnis berichtet, auch ein negatives oder gemischtes.
      Demonstrated:
        label: Demonstriert
        definition: Die Maßnahme wird angewendet und vorgeführt, ohne abgeschlossene Prüfung mit berichtetem Ergebnis.
      Proposed:
        label: Vorgeschlagen
        definition: Die Maßnahme wird empfohlen oder vorgeschlagen, auch eine erst geplante Evaluation bleibt ein Vorschlag.
      None:
        label: Keine Maßnahme
        definition: Das Werk behandelt keine Maßnahme.
  AN_Population:
    label: Handlungsfeld
    definition: Handlungsfeld oder Zielgruppe, die das Werk adressiert, nicht ein bloß vermuteter Einsatzort.
    values:
      Child_Family_Welfare:
        label: Kinder-, Jugend- und Familienhilfe
        definition: Hilfen für Kinder, Jugendliche und Familien einschließlich Kinderschutz.
      Mental_Health:
        label: Psychische Gesundheit
        definition: Psychosoziale Versorgung und Unterstützung bei psychischen Belastungen und Erkrankungen.
      Health_Care:
        label: Gesundheitsversorgung
        definition: Medizinische und pflegerische Versorgung.
      Homelessness_Youth:
        label: Wohnungslosigkeit und Jugend
        definition: Wohnungslosenhilfe und Angebote für junge Menschen in prekären Lebenslagen.
      Social_Assistance_Admin:
        label: Sozialleistungen und Verwaltung
        definition: Gewährung von Sozialleistungen und Sozialverwaltung.
      Education_Professional:
        label: Berufliche und hochschulische Bildung
        definition: Berufliche oder hochschulische Kontexte, in denen Fachkräfte oder Studierende den Umgang mit KI lernen.
      General_Social_Work:
        label: Soziale Arbeit allgemein
        definition: Soziale Arbeit ohne Festlegung auf ein einzelnes Handlungsfeld.
      Not_SW_Specific:
        label: Nicht spezifisch für Soziale Arbeit
        definition: Allgemeine oder nicht bestimmte Kontexte ohne Bezug auf ein Handlungsfeld der Sozialen Arbeit.
  AN_Task:
    label: Aufgabe
    definition: Aufgabe der beruflichen Praxis, für die das Werk den Einsatz von KI beschreibt, erprobt oder vorschlägt. Die Werte werden pilotiert.
    values:
      Documentation_Recording:
        label: Dokumentation
        definition: Fallbezogene Dokumentation, etwa Fall-, Gesprächs- und Verlaufsnotizen, Berichte und Hilfepläne.
      Case_Assessment_Decision_Support:
        label: Fallbeurteilung und Entscheidungsunterstützung
        definition: Einschätzung von Situationen, Risiken und Bedarfen sowie Unterstützung von Entscheidungen über Hilfen.
      Counselling_Client_Communication:
        label: Beratung und Kommunikation mit Klient:innen
        definition: Beratung, Gesprächsführung und schriftliche oder digitale Kommunikation mit Adressat:innen.
      Administration:
        label: Verwaltung
        definition: Organisatorische Aufgaben ohne Fallbezug, etwa Terminplanung, Anträge der Einrichtung, interne Korrespondenz und Abrechnung.
      Research:
        label: Forschung
        definition: Forschungstätigkeit in der Sozialen Arbeit, etwa Literaturarbeit, Datenanalyse und Schreiben.
      Teaching_Further_Education:
        label: Lehre und Weiterbildung
        definition: Studium, Lehre, Fort- und Weiterbildung von Fachkräften.
      Other_Task:
        label: Andere Aufgabe
        definition: Eine Aufgabe, die diese Liste nicht enthält. Die Aufgabe steht in den Notizen.
      None:
        label: Keine Aufgabe
        definition: Das Werk beschreibt keine Aufgabe, für die KI genutzt wird.
  AN_Gender_Definition:
    label: Definition von Geschlecht
    definition: Ob das Werk sagt, was es unter Geschlecht versteht, codiert aus dem Volltext.
    values:
      Explicit:
        label: Ausdrücklich
        definition: Das Werk bestimmt Geschlecht in einem eigenen Satz oder übernimmt ausdrücklich eine zitierte Bestimmung.
      Implicit_Only:
        label: Nur implizit
        definition: Das Werk bestimmt Geschlecht nicht, sein Verständnis ist aber aus Kategorien, Messung oder Theorierahmen erkennbar.
      Absent:
        label: Fehlt
        definition: Das Werk behandelt Geschlecht, ohne es zu bestimmen oder ein Verständnis erkennen zu lassen.
      Not_Applicable:
        label: Nicht anwendbar
        definition: Das Werk behandelt Geschlecht nicht als Gegenstand, Stichprobenangaben genügen nicht.
  AN_Bias_Definition:
    label: Definition von Bias
    definition: Ob das Werk sagt, was es unter Bias versteht, codiert aus dem Volltext.
    values:
      Explicit:
        label: Ausdrücklich
        definition: Das Werk bestimmt Bias, Diskriminierung oder Unfairness in einem eigenen Satz oder übernimmt ausdrücklich eine zitierte oder technische Bestimmung, etwa ein Fairnesskriterium.
      Implicit_Only:
        label: Nur implizit
        definition: Das Werk bestimmt Bias nicht, sein Verständnis ist aber aus Messung oder Rahmung erkennbar.
      Absent:
        label: Fehlt
        definition: Das Werk behandelt Bias, ohne ihn zu bestimmen oder ein Verständnis erkennen zu lassen.
      Not_Applicable:
        label: Nicht anwendbar
        definition: Das Werk behandelt Bias nicht als Gegenstand.
  AN_Gender_Understanding:
    label: Verständnis von Geschlecht
    definition: Verständnis von Geschlecht, das der eigenen Analyse des Werks zugrunde liegt.
    values:
      Binary_Categorical:
        label: Binär und kategorial
        definition: Geschlecht erscheint als zwei feste Kategorien, etwa Frau und Mann, ohne dass das Werk diese Setzung prüft.
      Social_Construct:
        label: Soziale Konstruktion
        definition: Das Werk hält ausdrücklich fest, dass Geschlecht sozial hergestellt, ein Verhältnis oder eine Machtstruktur ist.
      Non_Binary_Inclusive:
        label: Nicht-binär einschließend
        definition: Die Analyse führt Geschlechter jenseits der Binarität, etwa nicht-binäre oder trans Personen, als eigene Kategorien.
      Intersectional:
        label: Intersektional
        definition: Geschlecht wird in Wechselwirkung mit mindestens einer weiteren Achse analysiert.
      Unclear:
        label: Unklar
        definition: Das Werk behandelt Geschlecht, sein Verständnis ist aber nicht bestimmbar.
      Not_Applicable:
        label: Nicht anwendbar
        definition: Das Werk behandelt Geschlecht nicht als Gegenstand.
  AN_Theory_Reference:
    label: Theoriebezug
    definition: Ob das Werk eine Theorie, Theorietradition oder ein theoretisches Konzept benennt und damit seine Behandlung von Geschlecht oder Bias rahmt. Die Theorien selbst stehen als belegte Bezüge mit Fundstelle.
    values:
      "Yes":
        label: Ja
        definition: Das Werk rahmt seine Behandlung von Geschlecht oder Bias ausdrücklich theoretisch.
      "No":
        label: Nein
        definition: Das Werk nennt keinen solchen Theoriebezug.
  AN_Coding_Basis:
    label: Codierbasis
    definition: Text des Werks, auf dem die Codierung beruht.
    values:
      Fulltext:
        label: Volltext
        definition: Die Codierung beruht auf dem Volltext des Werks.
      Knowledge_Doc:
        label: Wissensdokument
        definition: Die Codierung beruht auf dem Wissensdokument zum Werk.
      Abstract:
        label: Abstract
        definition: Die Codierung beruht allein auf dem Abstract.
  AN_Notes:
    label: Notizen
    definition: Quellengebundene Erläuterungen, die konkrete Strategie hinter einer allgemeinen Anleitung und Vermerke zu nicht entscheidbaren Feldern.
  Studientyp:
    label: Studientyp
    definition: Kontrollierter Studientyp des Werks aus dem Kategorienschema des Projekts.
    values:
      Empirisch:
        label: Empirisch
        definition: Das Werk erhebt oder analysiert eigene Daten, etwa durch Befragung, Beobachtung oder Fallanalyse.
      Experimentell:
        label: Experimentell
        definition: Das Werk prüft Bedingungen in einem kontrollierten Versuchsaufbau, etwa Varianten von Prompts an einem Modell.
      Theoretisch:
        label: Theoretisch
        definition: Das Werk entwickelt oder diskutiert Begriffe und Argumente ohne eigene Datenerhebung.
      Konzept:
        label: Konzept
        definition: Das Werk entwirft ein Rahmenwerk, ein Modell, ein Curriculum oder ein Vorgehen.
      Literaturreview:
        label: Literaturreview
        definition: Das Werk fasst bestehende Literatur zusammen.
      Unclear:
        label: Unklar
        definition: Der Studientyp ist aus dem Werk nicht bestimmbar.
