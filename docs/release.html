<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feministische AI Literacies</title>
    <meta name="description" content="Quellengeprüfte Codierungen und Aussagen zu generativer KI, Gender und Bias in der Sozialen Arbeit mit ausgewiesenem Prüfstand.">
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="vendor/fontawesome/css/all.min.css">
    <link rel="stylesheet" href="css/research.css">
    <link rel="stylesheet" href="css/release.css">
    <link rel="stylesheet" href="css/release-netz.css">
</head>
<body>
<a class="skip-link" href="#main">Zum Inhalt</a>
<header class="release-header"><div class="header-content">
    <a class="brand-link" href="#view=fragen">Feministische AI Literacies</a>
    <nav aria-label="Ansichten" id="release-nav">
        <ul role="list">
            <li><a data-nav="fragen" href="#view=fragen">Fragen</a></li>
            <li><a data-nav="matrix" href="#view=matrix">Matrix</a></li>
            <li><a data-nav="netz" href="#view=netz">Netz</a></li>
            <li><a data-nav="korpus" href="#view=korpus">Korpus</a></li>
            <li><a data-nav="aussagen" href="#view=aussagen">Aussagen</a></li>
            <li><a data-nav="chat" href="#view=chat">Chat</a></li>
            <li><a data-nav="methode" href="#view=methode">Methode</a></li>
        </ul>
    </nav>
</div></header>
<main id="main" class="release-main">
    <p id="release-error" class="release-error" role="alert" hidden></p>

    <section id="view-fragen" data-view-root="fragen" hidden>
        <h1 id="fragen-title"></h1>
        <ol class="sq-list" id="sq-list"></ol>
        <p class="sq-more"><span class="meta-part"><a href="#view=korpus">Korpus durchsuchen</a></span> <span class="meta-part"><a href="#view=methode">Methode und Prüfstand</a></span></p>
    </section>

    <section id="view-frage" data-view-root="frage" hidden>
        <div id="frage-root"></div>
    </section>

    <section id="view-matrix" data-view-root="matrix" hidden>
        <h1>Matrix</h1>
        <div class="controls" id="matrix-controls" role="group" aria-label="Matrix einstellen">
            <label>Zeilen <select id="matrix-rows"></select></label>
            <label>Spalten <select id="matrix-cols"></select></label>
            <label>Jahr <select id="matrix-year"></select></label>
            <label>Studientyp <select id="matrix-study"></select></label>
            <label>Prüfstand <select id="matrix-status"></select></label>
        </div>
        <div id="matrix-denominator" class="denominators"></div>
        <div id="matrix-wrap" class="matrix-wrap" role="region" tabindex="0"></div>
        <p class="mark-legend" id="matrix-legend"></p>
        <section id="worklist" class="worklist-section" aria-labelledby="worklist-title" hidden></section>
    </section>

    <section id="view-netz" data-view-root="netz" hidden>
        <h1>Netz</h1>
        <div id="netz-root"></div>
    </section>

    <section id="view-korpus" data-view-root="korpus" hidden>
        <h1>Korpus</h1>
        <div id="korpus-root"></div>
    </section>

    <section id="view-aussagen" data-view-root="aussagen" hidden>
        <h1>Aussagen</h1>
        <div class="controls">
            <label>Suche <input id="evidence-search" type="search" autocomplete="off"></label>
        </div>
        <p id="assertion-count" class="result-count" aria-live="polite"></p>
        <div id="assertion-list"></div>
    </section>

    <section id="view-chat" data-view-root="chat" hidden>
        <h1>Chat</h1>
        <div class="chat-window" id="chat-container"></div>
    </section>

    <section id="view-methode" data-view-root="methode" hidden>
        <h1>Methode</h1>
        <div id="methode-root"></div>
    </section>

    <section id="view-werk" data-view-root="werk" hidden>
        <div id="werk-root"></div>
    </section>
</main>
<footer class="site-footer release-footer"><p>
    <span class="meta-part"><a href="downloads/research-data.zip">Datensatz</a></span>
    <span class="meta-part"><a href="downloads/data-dictionary.md">Datenbeschreibung</a></span>
    <span class="meta-part"><a href="data/release_manifest.json">Versionsnachweis</a></span>
</p></footer>
<script src="js/public-release.js"></script>
<script src="js/release-model.js"></script>
<script src="js/release-matrix.js"></script>
<script src="js/release-netz.js"></script>
<script src="js/release-werk.js"></script>
<script src="js/release-fragen.js"></script>
<script src="js/wissenschat.js"></script>
</body>
</html>
